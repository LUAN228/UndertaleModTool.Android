name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Baixar o código e Dependências Ocultas
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: 2. Travar o .NET na versão correta
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: 3. Instalar Motor do Android
      run: dotnet workload install android

    - name: 3.5. Limpar cache completo
      run: |
        echo "Removendo diretórios obj e bin..."
        find . -type d -name "obj" -prune -exec rm -rf {} + 2>/dev/null || true
        find . -type d -name "bin" -prune -exec rm -rf {} + 2>/dev/null || true

    - name: 4. Restaurar UndertaleModLib
      run: |
        UNDERLIB=$(find . -iname "UndertaleModLib.csproj" | head -n 1)
        if [ -n "$UNDERLIB" ]; then
          echo "Restaurando dependência: $UNDERLIB"
          dotnet restore "$UNDERLIB"
        fi

    - name: 5. Restaurar projeto Android
      run: |
        PROJECT_FILE=$(find . -iname "*android*.csproj" -not -path "*/bin/*" -not -path "*/obj/*" | head -n 1)
        
        if [ -z "$PROJECT_FILE" ]; then
          echo "ERRO: Não encontrei Android.csproj"
          exit 1
        fi
        
        echo "Restaurando: $PROJECT_FILE"
        dotnet restore "$PROJECT_FILE"

    - name: 6. Compilar Android APK (arm64)
      run: |
        PROJECT_FILE=$(find . -iname "*android*.csproj" -not -path "*/bin/*" -not -path "*/obj/*" | head -n 1)
        
        echo "Compilando para arm64: $PROJECT_FILE"
        dotnet publish "$PROJECT_FILE" -c Release -f net10.0-android -r android-arm64

    - name: 7. Compilar Android APK (x64)
      run: |
        PROJECT_FILE=$(find . -iname "*android*.csproj" -not -path "*/bin/*" -not -path "*/obj/*" | head -n 1)
        
        echo "Compilando para x64: $PROJECT_FILE"
        dotnet publish "$PROJECT_FILE" -c Release -f net10.0-android -r android-x64
        
    - name: 8. Salvar APKs
      uses: actions/upload-artifact@v4
      with:
        name: UTMT-Android-App
        path: '**/*.apk'
